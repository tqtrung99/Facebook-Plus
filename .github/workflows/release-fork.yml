name: Publish Facebook Plus fork DEBs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check package version and release tag
        run: |
          set -euo pipefail
          VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          test "$VERSION" = "1.0.2-2"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Theos
        run: |
          brew install ldid dpkg xz
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
      - name: Build and validate both DEBs
        run: |
          set -euo pipefail
          ./build.sh
          for scheme in rootless rootfull; do
            pkg="packages/Facebook-Plus-v${VERSION}-${scheme}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Version)" = "$VERSION"
          done
      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Plus-v1.0.2-2-DEBs
          path: packages/Facebook-Plus-v1.0.2-2-*.deb
          if-no-files-found: error
      - name: Create release tag and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            "packages/Facebook-Plus-v${VERSION}-rootless.deb" \
            "packages/Facebook-Plus-v${VERSION}-rootfull.deb" \
            --target "$GITHUB_SHA" \
            --title "Facebook Plus v${VERSION}" \
            --notes "Upstream-first fork with Story/Reels downloader fixes, Vietnamese language selector, LinkBridge aliases and Safari extension support. FBAudioFix and ShopeeBlocker remain standalone; neither is bundled into these FBPlus DEBs. Tested rootless and as a combined IPA; legacy deep-link aliases require separate verification."
